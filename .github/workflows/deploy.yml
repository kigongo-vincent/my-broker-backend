name: CI/CD [GitHub -> Docker Hub -> EC2]

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # 1. Create .env file from secret
      - name: Create .env file
        run: |
          echo "${{ secrets.ENV_FILE }}" > .env

      # 2. Build Docker image
      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/${{ secrets.PROJECT_NAME }}:latest .

      # 3. Login to Docker Hub
      - name: Docker Hub login
        run: |
          echo "${{ secrets.DOCKER_PAT }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      # 4. Push image to Docker Hub
      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/${{ secrets.PROJECT_NAME }}:latest

      # 5. Deploy to EC2
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.9
        with:
          host: ${{ secrets.EC2_HOST }}
          port: 22
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }} # use a proper SSH key, not Docker PAT
          script: |
            # Pull latest image
            docker pull ${{ secrets.DOCKER_USERNAME }}/${{ secrets.PROJECT_NAME }}:latest

            # Recreate .env on EC2
            echo "${{ secrets.ENV_FILE }}" > .env

            # Stop old container if exists
            docker stop ${{ secrets.PROJECT_NAME }} || true
            docker rm ${{ secrets.PROJECT_NAME }} || true

            # Run container with .env
            docker run -d \
              --name ${{ secrets.PROJECT_NAME }} \
              --env-file .env \
              -p ${{ secrets.PORT }}:3000 \
              ${{ secrets.DOCKER_USERNAME }}/${{ secrets.PROJECT_NAME }}:latest
