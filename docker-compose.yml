services:
  database:
    image: postgres:16-alpine
    container_name: my-broker-db6
    environment:
      POSTGRES_DB: my_broker_db4
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: Admin@2025
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d my_broker_db4"]
      interval: 5s
      timeout: 5s
      retries: 5

